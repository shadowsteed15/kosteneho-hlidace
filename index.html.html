:root{color-scheme:dark;--gold:#f2c875;--bg:#14111c;--panel:#251f2d;--muted:#c9bdcc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#38283b,#14111c 65%);color:#fff4e6;font:17px/1.6 system-ui,-apple-system,sans-serif;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:22px 16px 70px}header{text-align:center;padding:16px 0 20px}h1{font:700 clamp(27px,7vw,42px)/1.12 Georgia,serif;color:var(--gold);margin:8px 0}h2{font:700 27px Georgia,serif;color:var(--gold);margin:4px 0 18px}h3{color:var(--gold)}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#dac6ac}.panel{background:#211b29ed;border:1px solid #685469;border-radius:20px;padding:23px;box-shadow:0 12px 35px #0005}.story{background:#302637;border-left:3px solid var(--gold);border-radius:12px;padding:16px 18px;margin:16px 0 22px;font-family:Georgia,serif;font-size:18px}.story p{margin:0 0 13px}.story p:last-child{margin:0}.hint{color:var(--muted);font-size:14px}.question{font-weight:700;margin:18px 0 10px}.option{display:flex;gap:10px;align-items:center;background:#392e3e;border:1px solid #66556b;padding:12px;border-radius:12px;margin:9px 0;cursor:pointer}.option input{accent-color:var(--gold);width:19px;height:19px;flex:none}.btn{display:block;width:100%;background:var(--gold);color:#211426;border:0;border-radius:12px;padding:14px 16px;margin-top:18px;font-size:17px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}.feedback{padding:13px;border-radius:12px;background:#263d32;margin:15px 0}.error{background:#4a2934}.letters{font-size:31px;letter-spacing:8px;text-align:center;color:var(--gold);font-weight:bold}.input{background:#392e3e;border:1px solid #86708a;border-radius:12px;color:white;font-size:18px;padding:14px;width:100%;text-transform:uppercase}.progress{height:7px;background:#4a3b4d;border-radius:12px;overflow:hidden;margin:14px 0 8px}.progress>div{height:100%;background:var(--gold);transition:width .3s}.painting{width:100%;border-radius:12px;border:2px solid #a17b53;cursor:zoom-in}.small{font-size:13px;color:var(--muted)}.divider{height:1px;background:#635367;margin:22px 0}a{color:var(--gold)}.hidden{display:none}.center{text-align:center}.trophy{font-size:60px}.back{font-size:14px;background:none;border:0;color:#cdbed0;text-decoration:underline;cursor:pointer;padding:8px 0}#lightbox{position:fixed;inset:0;background:#000e;display:none;place-items:center;padding:12px;z-index:10}#lightbox img{width:100%;max-width:1200px;max-height:85vh;object-fit:contain}#lightbox button{position:absolute;top:12px;right:12px;border:0;background:#fff;color:#111;border-radius:50%;font-size:24px;width:40px;height:40px} @media(min-width:700px){.panel{padding:32px}}
.letters{display:flex;justify-content:center;gap:8px;margin:18px 0 24px}.letter{display:flex;align-items:center;justify-content:center;width:42px;height:48px;border:2px solid #b9945b;border-radius:8px;background:#241b20;color:#f4d58c;font-size:1.6rem;font-weight:800}.restart-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.restart-actions .btn,.restart-actions .back{width:auto;margin:6px 0}#restartConfirm{padding:12px;border:1px solid #b9945b;border-radius:12px;margin:12px 0}</style></head><body><main class="wrap"><header><div class="eyebrow">🎃 Halloweenská výprava 🎃</div><h1>💀 Prokletí Kostěného hlídače</h1><div id="stepTitle" class="hint"></div><div class="progress"><div id="bar"></div></div></header><section class="panel" id="app"></section><button class="back" id="restart" type="button">Začít hru od začátku</button><div id="restartConfirm" class="hidden" role="group" aria-label="Potvrzení nového začátku"><p class="center">Opravdu chceš začít od začátku? Dosavadní postup se smaže.</p><div class="restart-actions"><button type="button" class="btn" id="restartYes">Ano, začít znovu</button><button type="button" class="back" id="restartNo">Zrušit</button></div></div><p class="small center">Hraj pouze na bezpečném místě mimo silnici. Nevstupuj do ruin ani na soukromé pozemky.</p></main><div id="lightbox"><button aria-label="Zavřít" onclick="document.getElementById('lightbox').style.display='none'">×</button><img id="large" alt="Historický obraz Matějova útěku"></div><script>

 }
}
function showPainting(){document.getElementById('large').src=painting;document.getElementById('lightbox').style.display='grid'}function render(){document.getElementById('stepTitle').textContent=`${titles[step]} · ${step+1}/10`;document.getElementById('bar').style.width=((step+1)/10*100)+'%';let s='';switch(step){case 0:s=`<h2>Tajemství starého statku</h2>${story('Před mnoha a mnoha lety žil na zdejším statku čeledín jménem <strong>Matěj Kostka</strong>.\n\nJednoho dne podlehl pokušení. Svému pánovi ukradl truhličku plnou zlatých mincí a uprchl s ní do okolních polí a lesů.\n\nKdyž statkář zjistil, co se stalo, rozhněval se a vyřkl nad Matějem strašlivou kletbu.\n\nOd té doby se prý každého Halloweenu v okolí starého statku objevuje podivný kostlivec. Bloudí krajinou a hledá poklad, který kdysi ukryl.\n\nŘíká se, že jeho prokletí skončí teprve tehdy, až bude ukradené zlato nalezeno a Matěj se ho konečně vzdá.\n\nLetos se však stalo něco neobvyklého. Matěj zanechal zprávu. Možná právě ty jsi ten, kdo mu dokáže pomoci.') }<p><strong>Vydej se k malému mostku přes Lidický potok u starého statku.</strong> Tam začíná jeho příběh.</p><p><em>Ale buď opatrný… Ne všechno, co se v okolí statku skrývá, patří mezi živé.</em></p>${btn('Jsem u mostku!')}`;break;
case 1:s=`<h2>🌉 Mostek přes potok</h2>${story('„Haló… Slyšíš mě?\n\nUž je to tak dávno, co jsem naposledy s někým mluvil…\n\nJmenuji se Matěj Kostka. Kdysi jsem pracoval na statku, který stával nedaleko tohoto potoka.\n\nJedné noci jsem udělal něco strašlivě hloupého. Ukradl jsem svému pánovi zlato a ukryl ho. Jenže od té doby nemohu najít klid.\n\nVzpomínky se mi pletou. Pamatuji si jen starou bránu… Tam to všechno začalo.\n\nDokážeš najít místo, kde jsem kdysi sloužil?“')}<div class="question">Kde Matěj pracoval?</div>${radios(['Ve starém mlýně','Na starém statku','V zájezdním hostinci'])}<div id="feedback"></div><button class="btn" onclick="checkRadio(1,'Ano… Statek! Jeho brána musí být někde blízko. Běž k ní!')">Ověřit odpověď</button><div id="continue" class="hidden">${btn('Jsem u brány statku')}</div>`;break;
case 2:s=`<h2>🏚️ Brána statku</h2>${story('„Ano… Tohle je ono. Tady jsem kdysi pracoval.\n\nPamatuji si tu noc. Můj pán zjistil, že jsem mu ukradl zlato. Jeho křik se rozléhal po celém dvoře.\n\nProklel mě. Řekl, že dokud se ukradený poklad nenajde, nedojdu pokoje.\n\nPak jsem utekl. Ale kam? Vzpomínám si, že jsem si tehdy poznamenal místo, kam jsem zamířil. Jenže ze slov mi zůstala pouze čísla…“')}<div class="letters">13 – 25 – 20 – 9 – 14 – 1</div><p class="hint center">A = 1, B = 2, C = 3 … Z = 26</p><div class="question">Kam Matěj utekl?</div><input id="word" class="input" placeholder="Rozluštěné slovo"><div id="feedback"></div><button class="btn" onclick="verifyWord('MYTINA')">Ověřit šifru</button><div id="continue" class="hidden"><p>„Mýtina! Ano, už si vzpomínám. Byla hned vedle statku. Možná tam najdeme další stopu!“</p>${btn('Pokračovat na mýtinu')}</div>`;break;
case 3:s=`<h2>🌳 Stopy na mýtině</h2>${story('„Ano! Tady jsem se zastavil, když jsem utíkal ze statku.\n\nTehdy tu rostly stromy a já se mezi nimi snažil ukrýt. Jenže dnes to tu vypadá úplně jinak…\n\nDokážeš zjistit, co se s tímhle místem stalo? Rozhlédni se pořádně kolem sebe. Možná tu ještě zůstaly nějaké stopy.“')}<div class="question">Terénní průzkum</div>${['Najdi pařez nebo jinou stopu po pokáceném stromu.','Najdi místo, kde mýtina přechází v porost stromů.','Rozhlédni se a urči, kterým směrem od tebe leží starý statek.'].map(x=>`<label class="option"><input type="checkbox" class="task" onchange="taskDone()">${x}</label>`).join('')}<div id="continue" class="hidden"><div class="feedback">„Výborně! Teď si vzpomínám, že jsem odtud pokračoval podél potoka. Před sebou jsem měl otevřená pole a v dálce vesnici…“</div><p><strong>Další zastávka:</strong> 50° 8.312′ N, 14° 10.358′ E</p><a href="https://www.google.com/maps/search/?api=1&query=50.1385333%2C14.1726333" target="_blank" rel="noopener">📍 Otevřít souřadnice v mapě</a>${btn('Dorazil jsem na polní cestu')}</div>`;break;
case 4:s=`<h2>🌾 Polní cesta</h2>${story('„Ano… Tudy jsem běžel! Teď už si na to vzpomínám.\n\nZa zády jsem nechal statek a před sebou měl otevřená pole. V dálce jsem zahlédl vesnici. Na okamžik mě napadlo, že bych se tam mohl schovat.\n\nAle neodvážil jsem se. Co kdyby mě tam někdo poznal?\n\nRozhlédl jsem se a uviděl jiné místo. Temné, zarostlé a plné stromů. Tam mě přece nikdo neuvidí!\n\nAlespoň jsem si to tehdy myslel…“')}<div class="question">Kam Matěj zamířil?</div>${radios(['Do vesnice v dálce','Do hustého větrolamu mezi poli','Zpátky ke statku'])}<div id="feedback"></div><button class="btn" onclick="checkRadio(1,'Ano! Stromy! Tam jsem se chtěl ukrýt i se zlatem. Ale něco tam nebylo v pořádku…')">Ověřit odpověď</button><div id="continue" class="hidden">${btn('Jsem u prvního větrolamu')}</div>`;break;
case 5:s=`<h2>🌲 Něco mezi stromy</h2>${story('„Tady… Tady jsem chtěl svůj poklad ukrýt!\n\nMezi těmi stromy mě přece nikdo nemohl najít. Jenže sotva jsem vstoupil dovnitř, uslyšel jsem něco podivného.\n\nNejdřív jsem si myslel, že je to vítr. Potom jsem ale zaslechl kroky. A přitom jsem nikoho neviděl…\n\nNevím, co se v tomhle místě skrývá. Ale jedno vím jistě. Když jsem odtud utíkal, zlato jsem měl pořád u sebe.\n\nProjdi větrolamem a pozorně poslouchej. Možná tam stále něco je…“')}<h3>👂 Nastraž uši!</h3><p>Během průchodu poslouchej zvuky kolem sebe. Zapamatuj si vše neobvyklé, co uslyšíš.</p><p class="hint">Strašidelné zvuky spustí dospělí samostatně. Pozorně poslouchej a zapamatuj si je!</p>${btn('Vyšel jsem z větrolamu')}`;break;
case 6:s=`<h2>👂 Co jsi slyšel?</h2>${story('„Takže jsi to slyšel také?\n\nJá věděl, že se mi to tehdy jen nezdálo!\n\nUtíkal jsem mezi stromy, co mi síly stačily. Ale některé zvuky mě pronásledují ve vzpomínkách dodnes.\n\nPověz mi, co jsi zaslechl. Možná si díky tomu vzpomenu, kudy jsem utekl…“')}<div class="question">Vyber všechny zvuky, které jsi slyšel:</div>${[['steps','Kroky na cestě'],['owl','Houkat sovu'],['laugh','Tichý, podivný smích'],['bells','Zvony z kostela'],['chains','Řinčení řetězů']].map(x=>`<label class="option"><input class="sound" type="checkbox" value="${x[0]}">${x[1]}</label>`).join('')}<div id="feedback"></div><button class="btn" onclick="verifySounds()">Ověřit zvuky</button><div id="continue" class="hidden"><p>„Utíkal jsem dál, až jsem dorazil na rozcestí. Tam jsem se musel rozhodnout, kudy pokračovat.“</p>${btn('Jsem u rozcestí')}</div>`;break;
case 7:s=`<h2>🔐 Tajemství rozcestí</h2>${story('„Tady jsem se musel rozhodnout, kudy dál. Všechno se mi plete…\n\nKdyž jsem utíkal, pořád jsem se ohlížel přes rameno. Možná proto je i moje vzpomínka nějak obrácená…“')}<p class="center eyebrow">Zašifrovaný směr</p><div class="letters">A V E L O D</div><div class="question">Kterým směrem pokračovat?</div><input id="word" class="input" placeholder="Napiš směr"><div id="feedback"></div><button class="btn" onclick="verifyWord('DOLEVA')">Ověřit šifru</button><div id="continue" class="hidden"><p>„Doleva! Ano, už si vzpomínám! Na rozcestí jsem odbočil doleva a pokračoval mezi stromy. Bál jsem se, že mě něco pronásleduje, a tak jsem se ani jednou nezastavil.“</p>${btn('Prošel jsem posledním větrolamem')}</div>`;break;
case 8:s=`<h2>🐦‍⬛ Zapomenutá vzpomínka</h2>${story('„Počkej… Tohle místo poznávám!\n\nKdyž jsem vyběhl z lesa, na chvíli jsem se zastavil. Přede mnou se táhla cesta a v dálce jsem zahlédl domy.\n\nJenže byl jsem tak vyděšený, že si už nedokážu vybavit, kam jsem se vydal potom.\n\nV mé paměti zůstal jediný obraz té noci. Možná v něm najdeme odpověď. Prohlédni si ho opravdu pozorně…“')}<p class="hint">Klepnutím obrázek zvětšíš.</p><img class="painting" src="${painting}" alt="Starobylá cesta, Matěj s truhličkou, havrani a podivné stíny" onclick="showPainting()"><p><strong>Odhal tajné slovo:</strong></p><div class="letters" aria-label="Postupně odhalované tajné slovo">${qs.map((q,i)=>`<span class="letter" id="letter-${i}">?</span>`).join('')}</div>${qs.map((q,i)=>`<div id="painting-question-${i}" class="${i===0?"":"hidden"}"><div class="divider"></div><div class="question">${i+1}. ${q[0]}</div>${q[1].map((a,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" onchange="verifyPaintingQuestion(${i})">${a}</label>`).join('')}<div id="painting-feedback-${i}"></div></div>`).join('')}<div id="painting-complete" class="hidden"><div class="feedback">✓ Všech pět písmen je odhaleno! Tajné slovo je <strong>DOMOV</strong>.</div></div><div id="continue" class="hidden">${story('„DOMOV! Ano… Už si vzpomínám! Vrať se tam, odkud jsi vyšel. Až tam dorazíš, snad si konečně vybavím, kde jsem poklad ukryl…“')}<p class="hint">Než budeš pokračovat, bezpečně se vrať domů. Na silnici telefon nepoužívej.</p>${btn('Jsem zpátky doma')}</div>`;break;
case 9:s=`<h2>🏠 Matějova poslední vzpomínka</h2>${story('„Počkej… Tohle místo… Já ho poznávám!\n\nAno! Teď už si vzpomínám! Právě tady jsem tehdy ukryl truhlu se zlatem!\n\nAle něco je jinak… Když jsem tu byl naposledy, žádný dům tady nestál. Byl tu jen starý sklep, napůl ukrytý pod zemí. Právě tam jsem truhlu schoval.\n\nA ještě si vzpomínám na jednu zvláštní věc…\n\nU vchodu seděla černá kočka. Dívala se na mě tak podivnýma očima, až mi běhal mráz po zádech. A když jsem se na ni podíval znovu, přísahal bych, že už to nebyla ta samá kočka…\n\nNevím, jestli tam stále hlídá. Ale jestli ji najdeš, možná najdeš i můj poklad.\n\nProsím, pomoz mi dokončit, co jsem před tolika lety nedokázal. Jen tak může být moje prokletí konečně zlomeno…“')}<h3>🐈‍⬛ Poslední úkol</h3><p>Najdi černou kočku z Matějovy vzpomínky. Pozorně si ji prohlédni. Některé věci vypadají jinak, když změníš úhel pohledu…</p><label class="option"><input type="checkbox" id="found" onchange="document.getElementById('finalbutton').disabled=!this.checked">Našel jsem truhlu a přečetl Matějův dopis.</label><button class="btn" id="finalbutton" disabled onclick="finish()">💀 Zlomit prokletí!</button><div id="ending"></div>`;break;}app.innerHTML=s}function finish(){playEffect('success');document.getElementById('ending').innerHTML=`<div class="divider"></div><div class="center trophy">✨💀✨</div><h2 class="center">PROKLETÍ ZLOMENO!</h2>${story('„Dokázal jsi to! Po tolika letech je můj poklad konečně nalezen.\n\nCelou tu dobu jsem si myslel, že zlato mi přinese štěstí. Teď už vím, že právě kvůli němu jsem o všechno přišel.\n\nNechci ho zpátky. Ať je odměnou za tvou odvahu a pomoc.\n\nDěkuji ti, příteli. Konečně mohu odpočívat v pokoji.\n\nSbohem…“')}<p class="center"><strong>🏆 Mise splněna! Poklad patří jeho nálezci. 🪙</strong></p>`;document.getElementById('finalbutton').disabled=true;localStorage.setItem(KEY+'-finished','yes')}document.getElementById('restart').addEventListener('click',()=>{const panel=document.getElementById('restartConfirm');panel.classList.remove('hidden');panel.scrollIntoView({behavior:'smooth',block:'nearest'});});document.getElementById('restartNo').addEventListener('click',()=>document.getElementById('restartConfirm').classList.add('hidden'));document.getElementById('restartYes').addEventListener('click',()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(KEY+'-finished')}catch(e){}step=0;document.getElementById('restartConfirm').classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'});});render();if(step===9&&localStorage.getItem(KEY+'-finished')==='yes'){document.getElementById('found').checked=true;finish()}
</script></body></html>
